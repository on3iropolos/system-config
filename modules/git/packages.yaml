description: Git identity and GitHub CLI

# Stump-only package set. `gh` is the Ubuntu name; on CachyOS the equivalent is
# `github-cli`, which owns /usr/bin/gh. The Ubuntu variant is re-added when
# machine-serial is brought back; see CHANGELOG.
packages:
  - git # both hosts
  - github-cli # pacman: github-cli (provides gh) | apt: n/a (deferred, machine-serial dormant)