description: Noctalia shell plus Umbriel compositor and Greeter for the CachyOS home laptop

conflicts:
  - desktop-gnome

# Point greetd at the installed Noctalia Greeter session. The hook is
# idempotent and runs as root each sync so the managed session stays current.
dotfiles_sync: true
dotfiles:
  - source: dotfiles/noctalia
    target: ~/.config/noctalia
  - source: dotfiles/umbriel
    target: ~/.config/umbriel

# Point greetd at the installed Noctalia session wrapper. The hook is
# idempotent and runs as root each sync so the managed session stays current.
post_install_hook: scripts/configure-greetd.sh
post_hook_behavior: always
run_hooks_as_user: false
