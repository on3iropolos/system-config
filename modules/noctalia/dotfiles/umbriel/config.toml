# Umbriel session configuration managed by dcli dotfiles_sync.
# Synced from modules/noctalia/dotfiles/umbriel/ to ~/.config/umbriel/.
# Validate with: umbriel config validate
# Full reference: https://docs.noctalia.dev/umbriel/
#
# Defining [keybinds] replaces the built-in bind set, so this file keeps the
# packaged defaults (adapted for alacritty) plus the Noctalia IPC set from
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel/
# Deviations from upstream defaults (to keep Noctalia chords):
# - Mod+Comma opens Noctalia Settings (upstream: consume-left).
#   consume-left/right moved to Mod+Shift+Comma/Period.
# - Mod+Space opens the Noctalia launcher (upstream: scratchpad-toggle).
#   scratchpad-toggle moved to Mod+Alt+Space.
# - Mod+Escape quits the session (upstream default). The Noctalia session
#   panel lives on Mod+E instead.

[include]
files = []

# Noctalia writes its Umbriel theme template here when enabled under
# Settings -> Templates -> Compositors. Keep the optional include so the
# generated colors load without editing this managed file.
[include.optional]
files = ["~/.config/umbriel/noctalia.toml"]

[general]
autostart = ["noctalia"]
mod_key = "Super"
xwayland = true
show_cheatsheet = true
focus_on_activate = false

# Laptop lid: drop the internal panel from the desktop while closed.
[events]
lid_close = "umbriel msg output-disable:eDP-1"
lid_open = "umbriel msg output-enable:eDP-1"

# Internal laptop panel. Positions stay automatic because stump currently has
# one display. Run `umbriel outputs` when adding a docked monitor.
[output.eDP-1]
mode = "3000x2000"
scale = 1.5
focus_at_startup = true
# Dynamic inventory with a floor of 3: workspaces 1-3 (Brave/vscodium/spotify
# targets) always exist, empty ones are kept, and extra workspaces still
# appear on demand. Use `workspaces = 3` instead for a fixed cap of 3.
workspaces = "dynamic"
min_workspaces = 3

# Rounded windows, consistent borders, blurred compositor background.
# From https://docs.noctalia.dev/noctalia/compositor-settings/umbriel/
[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 10

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[input.keyboard]
numlock_toggle = true

[layout]
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

[keybinds]
# --- Applications and session (alacritty is the stump terminal) ---
"Mod+Return" = { action = "spawn:alacritty", repeat = false }
"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Ctrl+R" = { action = "config-reload", repeat = false }
"Mod+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+I" = { action = "overview-toggle", repeat = false }

# --- Focus and movement ---
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
# "Mod+H" = "window-focus-left"
# "Mod+J" = "window-focus-down"
# "Mod+K" = "window-focus-up"
# "Mod+L" = "window-focus-right"
# "Mod+F1" = "window-focus-next"
# "Mod+Backspace" = "workspace-focus-last"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Ctrl+Left" = "workspace-previous"
"Mod+Ctrl+Right" = "workspace-next"

# --- Window state and layout ---
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
# "Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
# "Mod+Ctrl+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Shift+Comma" = "window-consume-left"
"Mod+Shift+Period" = "window-consume-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "column-move-left"
"Mod+Shift+WheelDown" = "column-move-right"

# --- Workspaces ---
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# --- Scratchpad (toggle remapped; see header) ---
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Alt+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"

# --- Noctalia shell controls ---
"Mod+Space" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+S" = "spawn:noctalia msg panel-toggle control-center"
"Mod+Comma" = "spawn:noctalia msg settings-toggle"
"Mod+E" = "spawn:noctalia msg panel-toggle session"
"Mod+Shift+W" = "spawn:noctalia msg panel-toggle wallpaper"
"Alt+Tab" = "spawn:noctalia msg window-switcher hold"
"Mod+Shift+A" = "spawn:noctalia msg screenshot-annotate"
"Mod+Ctrl+A" = "spawn:noctalia msg annotate"
"Mod+Shift+P" = "spawn:noctalia msg screenshot-region"
"Mod+Shift+L" = "spawn:noctalia msg session lock"
"Mod+Shift+C" = "spawn:noctalia msg caffeine-toggle"
"Mod+Shift+N" = "spawn:noctalia msg nightlight-toggle"
"Mod+Ctrl+M" = "spawn:noctalia msg mic-mute"

# --- Media and brightness (lock-safe, routed via Noctalia OSD) ---
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }

# Blur windows using the non-optimized path so translucent windows include
# overlapping windows behind them.
[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# App workspace placement. Integer default_workspace selects a one-based
# position; default_maximize opens at full column width (window-toggle-maximize).
[[window_rule]]
match.app_id = "^brave-browser$"
default_workspace = 1
default_maximize = true

[[window_rule]]
match.app_id = ["^codium$", "^vscodium$"]
default_workspace = 2
default_maximize = true

[[window_rule]]
match.app_id = "^spotify$"
default_workspace = 3
default_maximize = true

[[window_rule]]
match.app_id = ["^com[.]stremio[.]Stremio$", "^stremio$"]
default_maximize = true

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
