host: stump
description: Home laptop on CachyOS with Noctalia shell and Umbriel compositor

import:
  - hosts/shared/common.yaml

# Ordered module list. Sequential keeps installation order deterministic.
enabled_modules:
  - base
  - cachyos
  - git
  - ssh
  - fish
  - cli-tools
  - editors
  - browser
  - security
  - dev
  - noctalia

# All packages live in modules. Keep this empty.
packages: []

# Exclude the work-only shell. Package-level exclusions are unused: the shared
# modules currently declare only names that resolve on CachyOS. The mechanism is
# retained because it still works on the dcli declaration path and is needed
# again once machine-serial returns.
exclude:
  - desktop-gnome

services:
  enabled:
    - NetworkManager
    - greetd
  disabled: []

default_apps:
  scope: user
  browser: brave-browser.desktop
  terminal: Alacritty.desktop

flatpak_scope: user
auto_prune: false
module_processing: sequential
aur_helper: paru
editor: nano # falls back to $EDITOR when set

config_backups:
  enabled: true
  max_backups: 5

system_backups:
  enabled: true
  backup_on_sync: true
  backup_on_update: true
  tool: timeshift
  max_backups: 5
