# Shared settings imported by every host.
# dcli parses imports as full configurations, so `host` is required even though
# the importing host retains its own value.
# Keep distro-specific keys (package_manager, aur_helper) in hosts/*.yaml.
host: shared-common

flatpak_scope: user
auto_prune: false

config_backups:
  enabled: true
  max_backups: 5

system_backups:
  enabled: true
  backup_on_sync: true
  backup_on_update: true
  tool: timeshift
  max_backups: 5

editor: nano # falls back to $EDITOR when set
